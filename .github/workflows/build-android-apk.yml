name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies & sync Capacitor
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: |
          npm ci
          npm run android:sync

      - name: Configure Gradle Maven Central mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/maven-mirror.gradle
          allprojects {
              buildscript {
                  repositories {
                      maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
                  }
              }
              repositories {
                  maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
              }
          }
          EOF

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk 再开一局-android-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zaikaiyiju-android-apk
          path: 再开一局-android-debug.apk
